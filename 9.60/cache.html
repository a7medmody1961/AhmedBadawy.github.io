<!DOCTYPE html>
<html manifest="Cache.manifest">
<head>
    <meta charset="UTF-8">
    <title>PS4 7.00 TO 9.60 FW GoldHEN | BY Ahmed Badawy</title>
    <link rel="stylesheet" href="../style.css">
    
    <script src="exploit.js"></script>
</head>
<body>

    <script>
        // Karo exploits usually look for an element with id="progress"
        // This shim redirects it to your id="msgs"
        window.addEventListener('DOMContentLoaded', (event) => {
            window.progress = document.getElementById("msgs");
        });
    </script>

    <script>
        history.replaceState(null,null,'index.html');
        var histlength=history.length;
        history.go(-histlength);

        function DLProgress(e){
            // حساب النسبة المئوية
            Percent=(Math.round(e.loaded / e.total * 100));
            // تحديث النص في الكارد الخاص بك
            var msgElement = document.getElementById("msgs");
            if(msgElement) {
                msgElement.innerHTML = "Installing Offline Cache: " + Percent + "%";
            }
        }

        function DisplayCacheProgress(){
            var msgElement = document.getElementById("msgs");
            setTimeout(function(){
                if(msgElement) msgElement.innerHTML = "Cache Installed Successfully ✔";
            },1500);
            setTimeout(function(){
                if(msgElement) msgElement.innerHTML = "Now Close And Re-Open Your Browser ...";
            },3500);
        }

        window.applicationCache.addEventListener("progress",DLProgress,false);
        window.applicationCache.oncached=function(e){DisplayCacheProgress();};
        window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
    </script>

    <div class="container">
        
        <header>
            <h1>AHMED BADAWY</h1>
            <p class="subtitle">PS4 7.00 TO 9.60 FW GoldHEN</p>
        </header>

        <div class="card" style="min-width: 60%; min-height: 200px; margin: 0 auto;">
            <div class="card-content">
                <h2 id="msgs" style="font-size: 2rem; color: #ffd700; text-shadow: 0 2px 5px rgba(0,0,0,0.5);">
                    Loading Exploit...
                </h2>
            </div>
        </div>

        <footer>
            <p class="copyright">Designed by Ahmed Badawy</p>
        </footer>

    </div>
</body>
</html>
