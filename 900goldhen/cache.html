<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
<title>PS4 9.00 FW GoldHEN Host | Ahmed Badawy</title>
<style>
    body {
        background-image: url('../img.jpg');
        background-position: center;
        background-size: cover;
        background-attachment: fixed;
        background-repeat: no-repeat;
        background-color: #000;
        color: white;
        overflow: hidden;
        font-family: sans-serif;
        text-align: center;
        margin: 0;
        padding-top: 50px;
    }
    /* تنسيق العنوان الرئيسي */
    .main-title {
        font-size: 40px;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 3px 3px 0px #000;
        -webkit-text-stroke: 1px black;
    }
    /* تنسيق الرسائل والحالة */
    #msgs {
        font-size: 30px;
        color: #ffd700;
        margin-top: 40px;
        font-weight: bold;
        text-shadow: 2px 2px 0px #000;
        -webkit-text-stroke: 1px black;
    }
    /* تنسيق الفوتر */
    .footer {
        position: fixed;
        bottom: 20px;
        width: 100%;
        font-size: 14px;
        color: #ccc;
        text-shadow: 1px 1px 0px #000;
    }
</style>
</head>
<body>
<!-- سكربت الكاش (ممنوع اللمس) -->
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));setTimeout(function(){window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";},500)}
function DisplayCacheProgress(){setTimeout(function(){window.msgs.innerHTML="Cache Installed Successfully ✔";},1500);setTimeout(function(){window.msgs.innerHTML="Now Close And Re-Open Your Browser ...";},3500);}window.applicationCache.addEventListener("progress",DLProgress,false);window.applicationCache.oncached=function(e){DisplayCacheProgress();};window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
</script>

<!-- Header الجديد -->
<h1 class="main-title">AHMED BADAWY</h1>
<hr style="width: 300px; margin: 20px auto; border: 0; border-top: 1px solid #fff; opacity: 0.5;">

<!-- رسالة الحالة -->
<div id="msgs">Wait a Moment...</div>

<!-- الفوتر -->
<div class="footer">Designed by Ahmed Badawy</div>

</body>
</html>
